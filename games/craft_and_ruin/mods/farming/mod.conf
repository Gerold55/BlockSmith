title = Farming
description = Minecraft's farming: hoes till farmland, seeds grow into crops on random ticks (faster on wet farmland), and a scythe reaps ripe crops and replants them. Add crops with farming.register_crop.
# Loaded after these when they're installed, so its recipes, foods (survival) and creative tab
# (inventory) find their APIs. Either can be missing: farming still loads, without that part.
optional_depends = survival, inventory
