title = Game Showcase
author = BlockSmith
description = The whole game in one place. /showcase builds the Showcase Park next to you: a lighting hall where red, green and blue lamps mix, a stained-glass gallery that colours the sunlight, an avenue of coloured lamp posts and a lava pit, a pool with a fountain, a farm, a garden, a cow pen and a UI kiosk. A guide on screen tells you where you are, and F8 opens the control panel (time of day, weather, teleports, items, a live light meter).
version = 1.0
optional_depends = inventory, survival, farming, doors, mobs, weather, lava, ui_showcase, grass, tanks, buckets
