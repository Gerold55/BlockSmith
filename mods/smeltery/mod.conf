title = Smeltery
author = BlockSmith
description = Melt ores into liquid metal like Tinkers' Construct: a seared-brick smeltery holds several molten metals in layers you can see, alloys copper and gold into rose gold, and casts ingots and blocks through a drain, faucet, casting table and basin. Adds iron, gold and copper ores, ingots and blocks.
